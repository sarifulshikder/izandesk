# IzanDesk-managed FreeRADIUS SQL queries (PostgreSQL) - FR3 compatible structure
sql_user_name = "%{User-Name}"

client_query = "\
	SELECT id, nasname, shortname, type, secret, server \
	FROM ${client_table}"

authorize_check_query = "\
	SELECT id, username, attribute, value, op \
	FROM ${authcheck_table} \
	WHERE username = '%{SQL-User-Name}' \
	ORDER BY id"

authorize_reply_query = "\
	SELECT id, username, attribute, value, op \
	FROM ${authreply_table} \
	WHERE username = '%{SQL-User-Name}' \
	ORDER BY id"

authorize_group_check_query = "\
	SELECT id, groupname, attribute, value, op \
	FROM ${groupcheck_table} \
	WHERE groupname = '%{${group_attribute}}' \
	ORDER BY id"

authorize_group_reply_query = "\
	SELECT id, groupname, attribute, value, op \
	FROM ${groupreply_table} \
	WHERE groupname = '%{${group_attribute}}' \
	ORDER BY id"

group_membership_query = "\
	SELECT groupname \
	FROM ${usergroup_table} \
	WHERE username = '%{SQL-User-Name}' \
	ORDER BY priority"

accounting {
	reference = "%{tolower:type.%{%{Acct-Status-Type}:-%{Request-Processing-Stage}}.query}"

	type {
		start {
			query = "\
				INSERT INTO ${....acct_table1} \
					(acctsessionid, acctuniqueid, username, realm, nasipaddress, nasportid, nasporttype, acctstarttime, acctupdatetime, acctstoptime, acctsessiontime, acctauthentic, connectinfo_start, connectinfo_stop, acctinputoctets, acctoutputoctets, calledstationid, callingstationid, acctterminatecause, servicetype, framedprotocol, framedipaddress) \
				VALUES(\
					'%{Acct-Session-Id}', \
					'%{Acct-Unique-Session-Id}', \
					'%{SQL-User-Name}', \
					NULLIF('%{Realm}', ''), \
					NULLIF('%{NAS-IP-Address}', '')::inet, \
					'%{%{NAS-Port-Id}:-%{NAS-Port}}', \
					'%{NAS-Port-Type}', \
					NOW(), \
					NOW(), \
					NULL, \
					0, \
					'%{Acct-Authentic}', \
					'%{Connect-Info}', \
					NULL, \
					0, \
					0, \
					'%{Called-Station-Id}', \
					'%{Calling-Station-Id}', \
					NULL, \
					'%{Service-Type}', \
					'%{Framed-Protocol}', \
					NULLIF('%{Framed-IP-Address}', '')::inet)"

			query = "\
				UPDATE ${....acct_table1} SET \
					acctstarttime = NOW(), \
					acctupdatetime = NOW(), \
					connectinfo_start = '%{Connect-Info}', \
					nasipaddress = NULLIF('%{NAS-IP-Address}', '')::inet, \
					framedipaddress = NULLIF('%{Framed-IP-Address}', '')::inet \
				WHERE acctuniqueid = '%{Acct-Unique-Session-Id}' \
				AND acctstoptime IS NULL"
		}

		interim-update {
			query = "\
				UPDATE ${....acct_table1} SET \
					acctupdatetime = NOW(), \
					acctinterval = (NULLIF('%{Acct-Session-Time}', '')::bigint - COALESCE(acctsessiontime, 0)), \
					acctsessiontime = NULLIF('%{Acct-Session-Time}', '')::bigint, \
					acctinputoctets = (COALESCE(NULLIF('%{Acct-Input-Gigawords}', '')::bigint, 0) << 32) + COALESCE(NULLIF('%{Acct-Input-Octets}', '')::bigint, 0), \
					acctoutputoctets = (COALESCE(NULLIF('%{Acct-Output-Gigawords}', '')::bigint, 0) << 32) + COALESCE(NULLIF('%{Acct-Output-Octets}', '')::bigint, 0), \
					framedipaddress = NULLIF('%{Framed-IP-Address}', '')::inet \
				WHERE acctuniqueid = '%{Acct-Unique-Session-Id}' \
				AND acctstoptime IS NULL"
		}

		stop {
			query = "\
				UPDATE ${....acct_table2} SET \
					acctstoptime = NOW(), \
					acctupdatetime = NOW(), \
					acctsessiontime = NULLIF('%{Acct-Session-Time}', '')::bigint, \
					acctinputoctets = (COALESCE(NULLIF('%{Acct-Input-Gigawords}', '')::bigint, 0) << 32) + COALESCE(NULLIF('%{Acct-Input-Octets}', '')::bigint, 0), \
					acctoutputoctets = (COALESCE(NULLIF('%{Acct-Output-Gigawords}', '')::bigint, 0) << 32) + COALESCE(NULLIF('%{Acct-Output-Octets}', '')::bigint, 0), \
					acctterminatecause = '%{Acct-Terminate-Cause}', \
					connectinfo_stop = '%{Connect-Info}', \
					framedipaddress = NULLIF('%{Framed-IP-Address}', '')::inet \
				WHERE acctuniqueid = '%{Acct-Unique-Session-Id}' \
				AND acctstoptime IS NULL"

			query = "\
				INSERT INTO ${....acct_table1} \
					(acctsessionid, acctuniqueid, username, realm, nasipaddress, nasportid, nasporttype, acctstarttime, acctupdatetime, acctstoptime, acctsessiontime, acctauthentic, connectinfo_start, connectinfo_stop, acctinputoctets, acctoutputoctets, calledstationid, callingstationid, acctterminatecause, servicetype, framedprotocol, framedipaddress) \
				SELECT \
					'%{Acct-Session-Id}', \
					'%{Acct-Unique-Session-Id}', \
					'%{SQL-User-Name}', \
					NULLIF('%{Realm}', ''), \
					NULLIF('%{NAS-IP-Address}', '')::inet, \
					'%{%{NAS-Port-Id}:-%{NAS-Port}}', \
					'%{NAS-Port-Type}', \
					NOW(), \
					NOW(), \
					NOW(), \
					NULLIF('%{Acct-Session-Time}', '')::bigint, \
					'%{Acct-Authentic}', \
					NULL, \
					'%{Connect-Info}', \
					(COALESCE(NULLIF('%{Acct-Input-Gigawords}', '')::bigint, 0) << 32) + COALESCE(NULLIF('%{Acct-Input-Octets}', '')::bigint, 0), \
					(COALESCE(NULLIF('%{Acct-Output-Gigawords}', '')::bigint, 0) << 32) + COALESCE(NULLIF('%{Acct-Output-Octets}', '')::bigint, 0), \
					'%{Called-Station-Id}', \
					'%{Calling-Station-Id}', \
					'%{Acct-Terminate-Cause}', \
					'%{Service-Type}', \
					'%{Framed-Protocol}', \
					NULLIF('%{Framed-IP-Address}', '')::inet \
				WHERE NOT EXISTS (SELECT 1 FROM ${....acct_table1} WHERE acctuniqueid = '%{Acct-Unique-Session-Id}')"
		}

		accounting-on {
			query = "\
				UPDATE ${....acct_table1} SET \
					acctstoptime = NOW(), \
					acctupdatetime = NOW(), \
					acctterminatecause = '%{%{Acct-Terminate-Cause}:-NAS-Reboot}' \
				WHERE acctstoptime IS NULL \
				AND nasipaddress = NULLIF('%{NAS-IP-Address}', '')::inet"
		}

		accounting-off {
			query = "${..accounting-on.query}"
		}

		accounting {
			query = "SELECT true"
		}
	}
}

post-auth {
	query = "\
		INSERT INTO ${..postauth_table} \
			(username, pass, reply, authdate) \
		VALUES(\
			'%{SQL-User-Name}', \
			'%{%{User-Password}:-%{Chap-Password}}', \
			'%{reply:Packet-Type}', \
			NOW())"
}
