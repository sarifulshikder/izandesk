services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: izandesk-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-izandesk}
      POSTGRES_USER: ${POSTGRES_USER:-izandesk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-izandesk_secret_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../backups:/backups

  redis:
    image: redis:7-alpine
    container_name: izandesk-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data

  api:
    image: node:22-alpine
    container_name: izandesk-api
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: ${API_PORT:-4000}
      JWT_SECRET: ${JWT_SECRET:-izandesk-dev-secret-change-me}
      WEB_ORIGIN: ${WEB_ORIGIN:-}
      ALLOW_LAN_ORIGINS: ${ALLOW_LAN_ORIGINS:-true}
      DATABASE_URL: ${DATABASE_URL:-postgresql://izandesk_user:izandesk_secret_password@postgres:5432/izandesk}
      REDIS_HOST: redis
      GENIEACS_URL: ${GENIEACS_URL:-}
      GENIEACS_USER: ${GENIEACS_USER:-}
      GENIEACS_PASS: ${GENIEACS_PASS:-}
    volumes:
      - ..:/app
      - api_node_modules:/app/node_modules
      - ../backups:/app/backups
    command: ["sh", "-lc", "corepack enable >/dev/null 2>&1 || true; corepack prepare pnpm@10.37.0 --activate >/dev/null 2>&1 || true; pnpm install --frozen-lockfile=false; pnpm --filter @izandesk/shared-types build; pnpm --filter api build; node apps/api/dist/main.js"]
    ports:
      - "${API_PORT:-4000}:4000"

  web:
    image: node:22-alpine
    container_name: izandesk-web
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:4000}
      PORT: ${WEB_PORT:-3000}
    volumes:
      - ..:/app
      - web_node_modules:/app/node_modules
    command: ["sh", "-lc", "corepack enable >/dev/null 2>&1 || true; corepack prepare pnpm@10.37.0 --activate >/dev/null 2>&1 || true; pnpm install --frozen-lockfile=false; pnpm --filter @izandesk/shared-types build; pnpm --filter web build; pnpm --filter web exec next start -p ${WEB_PORT:-3000}"]
    ports:
      - "${WEB_PORT:-3000}:3000"

  freeradius:
    image: freeradius/freeradius-server:latest-3.2-alpine
    container_name: izandesk-freeradius
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    volumes:
      - ./radius/clients.conf:/etc/raddb/clients.conf:ro
      - ./radius/mods-enabled/sql:/etc/raddb/mods-enabled/sql:ro
      - ./radius/mods-config/sql/main/postgresql/queries.conf:/etc/raddb/mods-config/sql/main/postgresql/queries.conf:ro
      - ./radius/sites-enabled/default:/etc/raddb/sites-enabled/default:ro
    command: ["sh", "-c", "apk add --no-cache postgresql-libs >/dev/null 2>&1 || apk add --no-cache libpq >/dev/null 2>&1 || true; exec radiusd -f -l stdout"]

  genieacs:
    image: drumsergio/genieacs:latest
    container_name: izandesk-genieacs
    restart: unless-stopped
    profiles: ["acs"]
    depends_on:
      - redis
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: ${GENIEACS_MONGODB_CONNECTION_URL:-mongodb://mongo:27017/genieacs}
      GENIEACS_UI_JWT_SECRET: ${GENIEACS_UI_JWT_SECRET:-change-me}
    ports:
      - "7547:7547"
      - "7557:7557"
      - "7567:7567"
      - "3001:3000"

  mongo:
    image: mongo:6
    container_name: izandesk-mongo
    restart: unless-stopped
    profiles: ["acs"]
    volumes:
      - mongodata:/data/db

  caddy:
    image: caddy:2-alpine
    container_name: izandesk-caddy
    restart: unless-stopped
    network_mode: host
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
      CADDY_UPSTREAM: ${CADDY_UPSTREAM:-http://localhost:3000}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  wg-hub:
    build:
      context: ./wg-hub
    container_name: izandesk-wg-hub
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      WG_INTERFACE: ${WG_INTERFACE:-wg0}
    ports:
      - "${WG_HUB_PORT:-51820}:51820/udp"
    volumes:
      - ./wg-hub/config:/etc/wireguard
      - /lib/modules:/lib/modules:ro

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  api_node_modules:
  web_node_modules:
  mongodata:
