services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: izandesk-postgres
    restart: always
    environment:
      POSTGRES_DB: izandesk
      POSTGRES_USER: izandesk_user
      POSTGRES_PASSWORD: izandesk_secret_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: izandesk-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
